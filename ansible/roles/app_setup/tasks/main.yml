---
- name: Ensure Python3, pip, and venv are installed
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

- name: Ensure application directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Copy requirements.txt
  copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: "{{ app_dir }}/requirements.txt"
    mode: '0644'

- name: Install Python dependencies into virtual environment
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: "python3 -m venv"

- name: Copy application code
  copy:
    src: "{{ playbook_dir }}/../app"
    dest: "{{ app_dir }}/"
    mode: '0755'
  notify: Restart app

- name: Start the TODO API service if not running
  shell: |
    if [ -f {{ app_dir }}/app.pid ] && kill -0 $(cat {{ app_dir }}/app.pid) 2>/dev/null; then
      echo "Already running"
    else
      nohup {{ app_dir }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ app_port }} > {{ app_dir }}/app.log 2>&1 &
      echo $! > {{ app_dir }}/app.pid
    fi
  args:
    chdir: "{{ app_dir }}"
